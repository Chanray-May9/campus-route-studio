<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园路线管理后台</title><style>body{font-family:system-ui;max-width:900px;margin:35px auto;padding:24px;color:#243d35;background:#f4f7f1}label{display:block;margin:15px 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:8px;border:1px solid #d6e2d0;border-radius:8px;background:white}button{padding:12px 18px;background:#0c7464;color:white;border:0;border-radius:8px;margin:5px}textarea{font:13px monospace}p{line-height:1.8}.hint{color:#708573;font-size:12px}#message{white-space:pre-wrap}</style><h1>校园路线 · 轨迹管理</h1><p>上传或修改路线后，用户在 App 中点击“同步开发者更新的轨迹”即可获取。不接收脚本或 APK，只发布路线和回放参数。</p><label>管理员密码<input id="token" type="password" autocomplete="off"></label><button id="refresh">读取远程轨迹</button><label>已发布轨迹<select id="routes"><option value="">新建轨迹</option></select></label><label>轨迹 JSON（可粘贴手机 App 导出的备份文本）<textarea id="payload" rows="18">{"name":"学校操场","route":{"points":[{"lat":30,"lon":120},{"lat":30.001,"lon":120}],"speed":2.5,"loops":1},"motion":{"mode":"fixed","speed":2.5,"sway":0}}</textarea></label><button id="save">发布 / 更新轨迹</button><button id="new">新建</button><button id="delete">删除所选</button><p id="message" role="status"></p><p class="hint">请选择准确的学校场地坐标。管理员密码只用于当前页面请求，不会保存到浏览器存储。</p><script src="/admin.js" defer></script></html>
